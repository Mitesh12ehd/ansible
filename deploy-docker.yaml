---
- name: Install docker, docker compose
  hosts: ec2_server
  become: true
  tasks:  

    - name: Install docker and docker compose
      yum: 
        name: docker
        update_cache: true
        state: present

    - name: Install docker compose plugin
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: "+x"

    # to perform sudo systemctl docker start
    - name: Start docker daemon
      systemd:
        name: docker 
        state: started
        enabled: true

# to execute docker command without sudo
# sudo usermod -aG docker ec2-user
- name: Add ec2 user to docker group
  hosts: ec2_server
  become: true
  roles:
    - add_user_to_group

- name: Start docker containers
  hosts: ec2_server
  vars_files:
    - project-vars
  roles:
    - start_container