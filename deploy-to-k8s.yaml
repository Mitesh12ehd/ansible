---
- name: Deploy app in new namespace
  hosts: localhost
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
        kubeconfig: ~/Documents/GitHub/ansible/k8-cluster-kubeconfig.yaml
  
    - name: Deploy nginx app
      kubernetes.core.k8s:
        src: ~/Documents/GitHub/ansible/nginx-config.yaml
        state: present
        kubeconfig: ~/Documents/GitHub/ansible/k8-cluster-kubeconfig.yaml
        namespace: my-app