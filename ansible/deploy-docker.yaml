---
- name: Install docker, docker compose
  hosts: aws_ec2
  become: true
  tasks:  

    - name: Install docker and docker compose
      yum: 
        name: docker
        update_cache: true
        state: present

    - name: Install docker compose plugin
      get_url:
        url: "https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        mode: "+x"

    # to perform sudo systemctl docker start
    - name: Start docker daemon
      systemd:
        name: docker 
        state: started
        enabled: true