---
- name: Install node and npm
  hosts: 192.46.209.134
  tasks:
    - name: Update apt repo and cache
      apt: 
        update_cache: true 
        force_apt_get: true
        cache_valid_time: 3600 

    - name: Install node js and npm
      apt:
        pkg:
          - nodejs
          - npm

- name: Create new linux user
  hosts: 192.46.209.134
  tasks:
    - name: Create linux user
      user:
        name: node_user
        comment: node_user
        group: sudo

- name: Deploy nodejs app
  hosts: 192.46.209.134
  become: True
  become_user: node_user
  vars_files:
    - project-vars
  vars:
    - version: 1.0.0
  tasks:
    - name: Copy nodejs folder to server
      copy: 
        src: "{{node_file_location}}"
        dest: /home/node_user/node_app-{{version}}.tgz
    
    - name: Unpack the nodejs tgz file
      unarchive: 
        src: /home/node_user/node_app-1.0.0.tgz
        dest: /home/node_user
        remote_src: true  # to specify that use src path in remote server, instead of local
      
    - name: Install dependencies
      npm:
        path: /home/node_user/package

    - name: Start the application
      command:
        chdir: /home/node_user/package/app
        cmd: node server.js
      async: 1000
      poll: 0

    - name: Ensure app is running
      shell: ps aux | grep node
      register: app_status

    - debug: msg={{app_status.stdout_lines}}